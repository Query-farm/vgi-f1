[project]
name = "vgi-f1-notebooks"
version = "0.1.0"
description = "Recorded and live Formula 1 lap analysis through VGI"
requires-python = ">=3.13,<3.15"
dependencies = [
    "vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.46",
]

[tool.ruff]
builtins = ["coverage", "stops", "laps", "stint_summary", "event", "ordering", "points", "checks", "identity", "driver_stints", "driver_pits", "timing", "weather_summary"] # JupySQL result captures
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"] # SQL/prose line lengths; runtime check and verified companions precede helper imports
